[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-market-trainer"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.5.2",
  "scikit-learn==1.8.0",
  "scipy==1.18.0",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
test = [
  "iniconfig==2.3.0",
  "packaging==26.3",
  "pluggy==1.6.0",
  "Pygments==2.21.0",
  "pytest==9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
