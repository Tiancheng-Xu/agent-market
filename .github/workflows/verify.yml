name: verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: services/matcher-go/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/trainer/pyproject.toml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install trainer dependencies
        run: |
          python -m venv services/trainer/.venv
          services/trainer/.venv/bin/pip install -e 'services/trainer[test]'
      - name: Run reverse-induction regression gates
        run: |
          node scripts/validate-regression-gates.mjs
          node scripts/validate-i18n.mjs
          pnpm --dir apps/web exec vitest run src/i18n/LocalizedRoutes.test.tsx
      - name: Run contracts, TypeScript, Go, Python, Evidence and repository gates
        run: pnpm verify
