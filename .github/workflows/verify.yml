name: verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: services/matcher-go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/trainer/pyproject.toml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install trainer dependencies
        run: |
          python -m venv services/trainer/.venv
          services/trainer/.venv/bin/pip install -e 'services/trainer[test]'
      - name: Run non-deploy verification
        run: pnpm verify
