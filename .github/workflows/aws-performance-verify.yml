name: AWS performance architecture verify

on:
  pull_request:
    paths:
      - "apps/transaction-engine/**"
      - "database/migrations/**"
      - "infra/aws/**"
      - "services/performance-aggregator/**"
      - ".github/workflows/aws-performance-verify.yml"
  push:
    branches: [main]
    paths:
      - "apps/transaction-engine/**"
      - "database/migrations/**"
      - "infra/aws/**"
      - "services/performance-aggregator/**"
      - ".github/workflows/aws-performance-verify.yml"

permissions:
  contents: read

concurrency:
  group: aws-performance-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Web performance boundary
        run: pnpm --dir apps/web test && pnpm --dir apps/web typecheck

      - name: Verify transaction engine
        run: pnpm --dir apps/transaction-engine test && pnpm --dir apps/transaction-engine typecheck

      - name: Verify AWS infrastructure contract
        run: node --test infra/aws/template.test.mjs

      - name: Verify performance aggregator
        run: python3 -m unittest discover -s services/performance-aggregator -p 'test_*.py'
