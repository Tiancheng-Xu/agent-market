<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Market 全链路交付证据</title>
  <desc id="desc">从浏览器性能观测，经 Cloudflare 与 AWS，到证据回读和 AWS 可逆暂停的十步链路。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#22271f"/></marker>
    <style>
      .box{fill:#fffdf4;stroke:#22271f;stroke-width:2}.verified{fill:#e0ff57}.pending{fill:#ffe0a8}.line{stroke:#22271f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .title{font:700 25px PingFang SC,Noto Sans CJK SC,sans-serif;fill:#11150f}.detail{font:15px SFMono-Regular,Menlo,monospace;fill:#4b5147}.num{font:700 16px SFMono-Regular,Menlo,monospace;fill:#11150f}.label{font:700 13px SFMono-Regular,Menlo,monospace;fill:#11150f;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#f1efe5"/>
  <text x="70" y="60" class="title" font-size="34">一条请求，贯穿每个边界</text>
  <text x="70" y="92" class="detail">request_id 从浏览器观测贯穿到公开回读与暂停证明</text>

  <path class="line" d="M290 205H355"/><path class="line" d="M605 205H670"/><path class="line" d="M920 205H985"/><path class="line" d="M1235 205H1300"/>
  <path class="line" d="M1425 275V375"/><path class="line" d="M1300 445H1235"/><path class="line" d="M985 445H920"/><path class="line" d="M670 445H605"/><path class="line" d="M355 445H290"/>

  <g transform="translate(40 135)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">01</text><text x="18" y="64" class="title">浏览器 Web Vitals</text><text x="18" y="94" class="detail">LCP · CLS · INP</text><text x="18" y="121" class="label">已验证</text></g>
  <g transform="translate(355 135)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">02</text><text x="18" y="64" class="title">Cloudflare Edge</text><text x="18" y="94" class="detail">SSR + API 代理</text><text x="18" y="121" class="label">已验证</text></g>
  <g transform="translate(670 135)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">03</text><text x="18" y="64" class="title">API Gateway</text><text x="18" y="94" class="detail">HTTP 接入</text><text x="18" y="121" class="label">已验证</text></g>
  <g transform="translate(985 135)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">04</text><text x="18" y="64" class="title">接入 Lambda</text><text x="18" y="94" class="detail">校验 + 发布</text><text x="18" y="121" class="label">已验证</text></g>
  <g transform="translate(1300 135)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">05</text><text x="18" y="64" class="title">SNS</text><text x="18" y="94" class="detail">事件扇出</text><text x="18" y="121" class="label">已验证</text></g>

  <g transform="translate(1300 375)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">06</text><text x="18" y="64" class="title">SQS / DLQ</text><text x="18" y="94" class="detail">重试隔离</text><text x="18" y="121" class="label">已验证</text></g>
  <g transform="translate(985 375)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">07</text><text x="18" y="64" class="title">ECS Fargate</text><text x="18" y="94" class="detail">短时聚合</text><text x="18" y="121" class="label">已验证</text></g>
  <g transform="translate(670 375)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">08</text><text x="18" y="64" class="title">PostgreSQL</text><text x="18" y="94" class="detail">指标持久化</text><text x="18" y="121" class="label">已验证回读</text></g>
  <g transform="translate(355 375)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">09</text><text x="18" y="64" class="title">证据回读</text><text x="18" y="94" class="detail">指标 + 截图</text><text x="18" y="121" class="label">已验证</text></g>
  <g transform="translate(40 375)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">10</text><text x="18" y="64" class="title">AWS 暂停门禁</text><text x="18" y="94" class="detail">消费端关闭</text><text x="18" y="121" class="label">已验证暂停</text></g>

  <rect x="40" y="600" width="1510" height="90" fill="#11150f"/>
  <text x="70" y="638" fill="#e0ff57" class="label">验收规则</text>
  <text x="70" y="671" fill="#f1efe5" class="detail">没有生产回读，外部步骤不得标记为已验证。暂停时，共享 VPC、NAT、RDS 与其他项目保持不变。</text>
</svg>
