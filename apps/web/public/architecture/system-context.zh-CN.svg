<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" data-actors="browser-wallet|cloudflare-web|identity-api|transaction-api|sepolia-contracts|rpc-authority|blockscout|the-graph|api-gateway|lambda|sns|sqs-dlq|go-matcher|postgresql|python-trainer|replay-ops-pause|github-actions|cloudflare-delivery|evidence" data-lanes="web-identity|chain-authority|aws-async-ml|operations-delivery" role="img" aria-labelledby="title desc">
<title id="title">Agent Market V2 系统架构</title><desc id="desc">分区展示 Web 与身份、Sepolia 链上权威、AWS 异步链路、本地数据与模型 Gate，以及运维和交付边界。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081224"/><stop offset="1" stop-color="#111a31"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7085a9"/></marker><style>.lane{fill:#111d34;stroke:#263958;stroke-width:2}.box{fill:#192640;stroke:#4cdbf7;stroke-width:2}.external{stroke:#ffb454}.deferred{stroke:#aeb8cf;stroke-dasharray:7 6}.title{fill:#eef3ff;font:700 31px PingFang SC,Noto Sans CJK SC,sans-serif}.name{fill:#eef3ff;font:700 19px PingFang SC,Noto Sans CJK SC,sans-serif}.detail{fill:#aeb8cf;font:14px PingFang SC,Noto Sans CJK SC,sans-serif}.lane-title{fill:#4cdbf7;font:700 14px IBM Plex Mono,PingFang SC,sans-serif;letter-spacing:1.4px}.status-local{fill:#e0ff57;font:700 12px IBM Plex Mono,monospace}.status-pending{fill:#ffb454;font:700 12px IBM Plex Mono,monospace}.path{stroke:#7085a9;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="1240" fill="url(#bg)"/><text x="52" y="55" class="title">AGENT MARKET V2 / 系统架构</text><text x="52" y="84" class="detail">架构意图不是交付证据；每个外部 hop 必须有新的 V2 标识符与回读。</text>
<rect class="lane" x="32" y="110" width="1536" height="220" rx="14"/><text x="56" y="142" class="lane-title">WEB + 身份 / VERIFIED-LOCAL</text>
<g transform="translate(70 175)"><rect class="box" width="300" height="110" rx="10"/><text x="20" y="38" class="name">Browser + Wallet</text><text x="20" y="68" class="detail">发起 challenge 并完成签名</text><text x="20" y="94" class="status-local">verified-local</text></g><path class="path" d="M370 230H430"/>
<g transform="translate(430 175)"><rect class="box" width="330" height="110" rx="10"/><text x="20" y="38" class="name">Cloudflare Web Edge</text><text x="20" y="68" class="detail">输出 SSR、hydration 与 CSR fallback</text><text x="20" y="94" class="status-local">verified-local</text></g><path class="path" d="M760 230H820"/>
<g transform="translate(820 175)"><rect class="box" width="300" height="110" rx="10"/><text x="20" y="38" class="name">Identity API</text><text x="20" y="68" class="detail">消费一次性 nonce，签发 HttpOnly session</text><text x="20" y="94" class="status-local">verified-local</text></g><path class="path" d="M1120 230H1180"/>
<g transform="translate(1180 175)"><rect class="box" width="330" height="110" rx="10"/><text x="20" y="38" class="name">Transaction API</text><text x="20" y="68" class="detail">服务端生成 unsigned intent</text><text x="20" y="94" class="status-local">verified-local</text></g>
<rect class="lane" x="32" y="355" width="1536" height="220" rx="14"/><text x="56" y="387" class="lane-title">SEPOLIA 链上权威 / V2 PENDING-EXTERNAL</text>
<g transform="translate(70 420)"><rect class="box external" width="300" height="110" rx="10"/><text x="20" y="38" class="name">Sepolia Contracts</text><text x="20" y="68" class="detail">执行 escrow、staking 与 arbitration</text><text x="20" y="94" class="status-pending">pending-external</text></g><path class="path" d="M370 475H430"/>
<g transform="translate(430 420)"><rect class="box external" width="300" height="110" rx="10"/><text x="20" y="38" class="name">RPC Authority</text><text x="20" y="68" class="detail">精确回读 receipt 与 event</text><text x="20" y="94" class="status-pending">pending-external</text></g><path class="path" d="M730 475H810"/>
<g transform="translate(810 420)"><rect class="box external" width="300" height="110" rx="10"/><text x="20" y="38" class="name">Blockscout</text><text x="20" y="68" class="detail">执行独立 reconciliation</text><text x="20" y="94" class="status-pending">pending-external</text></g><path class="path" d="M1110 475H1190"/>
<g transform="translate(1190 420)"><rect class="box deferred" width="320" height="110" rx="10"/><text x="20" y="38" class="name">The Graph</text><text x="20" y="68" class="detail">达到查询规模触发条件后迁移</text><text x="20" y="94" class="detail">deferred</text></g>
<rect class="lane" x="32" y="600" width="1536" height="370" rx="14"/><text x="56" y="632" class="lane-title">AWS 异步链路 PENDING / 数据与模型 GATE VERIFIED-LOCAL</text>
<g transform="translate(70 675)"><rect class="box external" width="250" height="105" rx="10"/><text x="18" y="36" class="name">API Gateway</text><text x="18" y="65" class="detail">验证 HMAC 接入请求</text><text x="18" y="90" class="status-pending">pending-external</text></g><path class="path" d="M320 727H365"/>
<g transform="translate(365 675)"><rect class="box external" width="220" height="105" rx="10"/><text x="18" y="36" class="name">Lambda</text><text x="18" y="65" class="detail">校验并发布消息</text><text x="18" y="90" class="status-pending">pending-external</text></g><path class="path" d="M585 727H630"/>
<g transform="translate(630 675)"><rect class="box external" width="205" height="105" rx="10"/><text x="18" y="36" class="name">SNS</text><text x="18" y="65" class="detail">版本化 fan-out</text><text x="18" y="90" class="status-pending">pending-external</text></g><path class="path" d="M835 727H880"/>
<g transform="translate(880 675)"><rect class="box external" width="250" height="105" rx="10"/><text x="18" y="36" class="name">SQS / DLQ</text><text x="18" y="65" class="detail">部分 batch 失败并重试</text><text x="18" y="90" class="status-pending">pending-external</text></g><path class="path" d="M1005 780V808H515V825"/>
<g transform="translate(365 825)"><rect class="box" width="300" height="105" rx="10"/><text x="18" y="36" class="name">Go Matcher</text><text x="18" y="65" class="detail">执行 pgvector 精确召回</text><text x="18" y="90" class="status-local">T5 PostgreSQL pass</text></g><path class="path" d="M665 877H720"/>
<g transform="translate(720 825)"><rect class="box" width="280" height="105" rx="10"/><text x="18" y="36" class="name">PostgreSQL</text><text x="18" y="65" class="detail">原子持久化并支持 readback</text><text x="18" y="90" class="status-local">T4 / T5 / T7 local</text></g><path class="path" d="M1000 877H1060"/>
<g transform="translate(1060 825)"><rect class="box" width="450" height="105" rx="10"/><text x="18" y="36" class="name">Python Trainer + Safe JSON artifact</text><text x="18" y="65" class="detail">输出 candidate；review 后显式 approve / reject / activate</text><text x="18" y="90" class="status-local">T6 33 tests + review pass</text></g>
<rect class="lane" x="32" y="995" width="1536" height="200" rx="14"/><text x="56" y="1027" class="lane-title">运维 + 交付 / LOCAL GATES，V2 外部回读待验证</text>
<g transform="translate(70 1060)"><rect class="box" width="320" height="95" rx="10"/><text x="18" y="34" class="name">Replay / Ops / Pause</text><text x="18" y="64" class="detail">执行有界、可逆动作</text></g><path class="path" d="M390 1107H460"/>
<g transform="translate(460 1060)"><rect class="box" width="320" height="95" rx="10"/><text x="18" y="34" class="name">GitHub Actions</text><text x="18" y="64" class="detail">运行 contracts / TS / Go / Python Gate</text></g><path class="path" d="M780 1107H850"/>
<g transform="translate(850 1060)"><rect class="box external" width="320" height="95" rx="10"/><text x="18" y="34" class="name">Cloudflare Delivery</text><text x="18" y="64" class="detail">V2 deployment 与回读待验证</text></g><path class="path" d="M1170 1107H1240"/>
<g transform="translate(1240 1060)"><rect class="box" width="270" height="95" rx="10"/><text x="18" y="34" class="name">Evidence</text><text x="18" y="64" class="detail">维护事实边界与状态</text></g>
</svg>
