<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Agent Market 系统架构</title><desc id="desc">从用户和 MetaMask，经 Cloudflare、AWS 交易与异步服务、PostgreSQL，流向 Sepolia 智能合约。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1428"/><stop offset="1" stop-color="#101a31"/></linearGradient><linearGradient id="edge" x1="0" x2="1"><stop stop-color="#7f82ff"/><stop offset="1" stop-color="#4cdbf7"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7085a9"/></marker></defs><rect width="1440" height="820" fill="url(#bg)"/><g fill="none" stroke="#7085a9" stroke-width="2" marker-end="url(#arrow)"><path d="M190 135H305"/><path d="M475 135H590"/><path d="M760 135H875"/><path d="M1045 135H1160"/><path d="M960 190V290"/><path d="M960 380V470"/><path d="M875 335H755"/><path d="M590 335H480"/><path d="M1045 335H1160"/><path d="M1270 380V610H1010V650"/><path d="M960 560V650"/><path d="M875 515H755"/><path d="M590 515H480"/><path d="M305 515H190"/><path d="M1045 695H1160"/></g><g font-family="PingFang SC,Noto Sans CJK SC,Arial" text-anchor="middle"><g transform="translate(40 90)"><rect width="150" height="90" rx="10" fill="#18233b" stroke="#4cdbf7"/><text x="75" y="40" fill="#e1e7ff" font-size="18">用户</text><text x="75" y="64" fill="#4cdbf7" font-size="12">MetaMask</text></g><g transform="translate(305 90)"><rect width="170" height="90" rx="10" fill="#18233b" stroke="#7f82ff"/><text x="85" y="37" fill="#e1e7ff" font-size="18">Cloudflare Pages</text><text x="85" y="63" fill="#9da8c2" font-size="12">React + Vite</text></g><g transform="translate(590 90)"><rect width="170" height="90" rx="10" fill="#18233b" stroke="#7f82ff"/><text x="85" y="37" fill="#e1e7ff" font-size="18">Edge Worker</text><text x="85" y="63" fill="#9da8c2" font-size="12">request_id + 安全边界</text></g><g transform="translate(875 90)"><rect width="170" height="90" rx="10" fill="#18233b" stroke="#ffb454"/><text x="85" y="37" fill="#e1e7ff" font-size="18">API Gateway</text><text x="85" y="63" fill="#9da8c2" font-size="12">AWS 入口</text></g><g transform="translate(1160 90)"><rect width="220" height="90" rx="10" fill="#18233b" stroke="#ffb454"/><text x="110" y="37" fill="#e1e7ff" font-size="18">交易 API</text><text x="110" y="63" fill="#9da8c2" font-size="12">Next.js Lambda</text></g><g transform="translate(875 290)"><rect width="170" height="90" rx="10" fill="#18233b" stroke="#ffb454"/><text x="85" y="37" fill="#e1e7ff" font-size="18">PostgreSQL</text><text x="85" y="63" fill="#9da8c2" font-size="12">数据结构 + pgvector</text></g><g transform="translate(590 290)"><rect width="165" height="90" rx="10" fill="#18233b" stroke="#4cdbf7"/><text x="82" y="37" fill="#e1e7ff" font-size="18">事务发件箱中继</text><text x="82" y="63" fill="#9da8c2" font-size="12">幂等处理</text></g><g transform="translate(305 290)"><rect width="175" height="90" rx="10" fill="#18233b" stroke="#4cdbf7"/><text x="87" y="37" fill="#e1e7ff" font-size="18">SNS 事件</text><text x="87" y="63" fill="#9da8c2" font-size="12">版本化扇出</text></g><g transform="translate(1160 290)"><rect width="220" height="90" rx="10" fill="#18233b" stroke="#7f82ff"/><text x="110" y="37" fill="#e1e7ff" font-size="18">Sepolia RPC</text><text x="110" y="63" fill="#9da8c2" font-size="12">回执 + 事件回读</text></g><g transform="translate(875 470)"><rect width="170" height="90" rx="10" fill="#18233b" stroke="#4cdbf7"/><text x="85" y="37" fill="#e1e7ff" font-size="18">SQS 队列</text><text x="85" y="63" fill="#9da8c2" font-size="12">匹配 / 学习 / 运维</text></g><g transform="translate(590 470)"><rect width="165" height="90" rx="10" fill="#18233b" stroke="#4cdbf7"/><text x="82" y="37" fill="#e1e7ff" font-size="18">Go 匹配器</text><text x="82" y="