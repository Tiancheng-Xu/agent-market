<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Market full delivery evidence chain</title>
  <desc id="desc">Ten steps from browser performance observation through Cloudflare and AWS to evidence readback and reversible AWS pause.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#22271f"/></marker>
    <style>
      .box{fill:#fffdf4;stroke:#22271f;stroke-width:2}.verified{fill:#e0ff57}.pending{fill:#ffe0a8}.line{stroke:#22271f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .title{font:700 25px sans-serif;fill:#11150f}.detail{font:15px monospace;fill:#4b5147}.num{font:700 16px monospace;fill:#11150f}.label{font:700 13px monospace;fill:#11150f;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#f1efe5"/>
  <text x="70" y="60" class="title" font-size="34">ONE REQUEST, EVERY BOUNDARY</text>
  <text x="70" y="92" class="detail">request_id is preserved from browser observation to public readback and pause proof</text>

  <path class="line" d="M290 205H355"/><path class="line" d="M605 205H670"/><path class="line" d="M920 205H985"/><path class="line" d="M1235 205H1300"/>
  <path class="line" d="M1425 275V375"/><path class="line" d="M1300 445H1235"/><path class="line" d="M985 445H920"/><path class="line" d="M670 445H605"/><path class="line" d="M355 445H290"/>

  <g transform="translate(40 135)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">01</text><text x="18" y="64" class="title">Browser Web Vitals</text><text x="18" y="94" class="detail">LCP · CLS · INP</text><text x="18" y="121" class="label">VERIFIED</text></g>
  <g transform="translate(355 135)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">02</text><text x="18" y="64" class="title">Cloudflare Edge</text><text x="18" y="94" class="detail">SSR + API proxy</text><text x="18" y="121" class="label">VERIFIED</text></g>
  <g transform="translate(670 135)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">03</text><text x="18" y="64" class="title">API Gateway</text><text x="18" y="94" class="detail">HTTP ingestion</text><text x="18" y="121" class="label">VERIFIED</text></g>
  <g transform="translate(985 135)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">04</text><text x="18" y="64" class="title">Ingestion Lambda</text><text x="18" y="94" class="detail">validate + publish</text><text x="18" y="121" class="label">VERIFIED</text></g>
  <g transform="translate(1300 135)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">05</text><text x="18" y="64" class="title">SNS</text><text x="18" y="94" class="detail">event fan-out</text><text x="18" y="121" class="label">VERIFIED</text></g>

  <g transform="translate(1300 375)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">06</text><text x="18" y="64" class="title">SQS / DLQ</text><text x="18" y="94" class="detail">retry isolation</text><text x="18" y="121" class="label">VERIFIED</text></g>
  <g transform="translate(985 375)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">07</text><text x="18" y="64" class="title">ECS Fargate</text><text x="18" y="94" class="detail">short-lived aggregate</text><text x="18" y="121" class="label">VERIFIED</text></g>
  <g transform="translate(670 375)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">08</text><text x="18" y="64" class="title">PostgreSQL</text><text x="18" y="94" class="detail">metric persistence</text><text x="18" y="121" class="label">VERIFIED READBACK</text></g>
  <g transform="translate(355 375)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">09</text><text x="18" y="64" class="title">Evidence Readback</text><text x="18" y="94" class="detail">metric + screenshot</text><text x="18" y="121" class="label">VERIFIED</text></g>
  <g transform="translate(40 375)"><rect class="box verified" width="250" height="140"/><text x="18" y="27" class="num">10</text><text x="18" y="64" class="title">AWS Pause Gate</text><text x="18" y="94" class="detail">consumer off</text><text x="18" y="121" class="label">VERIFIED PAUSED</text></g>

  <rect x="40" y="600" width="1510" height="90" fill="#11150f"/>
  <text x="70" y="638" fill="#e0ff57" class="label">ACCEPTANCE RULE</text>
  <text x="70" y="671" fill="#f1efe5" class="detail">No external step becomes VERIFIED until production readback exists. Shared VPC, NAT, RDS and other projects remain protected during pause.</text>
</svg>
