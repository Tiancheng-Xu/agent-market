<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Agent Market 请求生命周期</title><desc id="desc">请求从浏览器经过 Edge、交易 API、数据库、队列和匹配器，最终完成 Sepolia 验证。</desc><defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1428"/><stop offset="1" stop-color="#101a31"/></linearGradient><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4cdbf7"/></marker></defs><rect width="1440" height="900" fill="url(#bg2)"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial" text-anchor="middle"><g fill="#18233b" stroke="#51617f"><rect x="30" y="50" width="150" height="56" rx="8"/><rect x="235" y="50" width="150" height="56" rx="8"/><rect x="440" y="50" width="170" height="56" rx="8"/><rect x="665" y="50" width="170" height="56" rx="8"/><rect x="890" y="50" width="170" height="56" rx="8"/><rect x="1115" y="50" width="140" height="56" rx="8"/><rect x="1290" y="50" width="120" height="56" rx="8"/></g><g fill="#e1e7ff" font-size="15"><text x="105" y="84">浏览器</text><text x="310" y="84">Edge</text><text x="525" y="84">交易 API</text><text x="750" y="84">PostgreSQL</text><text x="975" y="84">SNS / SQS</text><text x="1185" y="84">匹配器</text><text x="1350" y="84">Sepolia</text></g><g stroke="#34425f" stroke-dasharray="5 7"><path d="M105 106V850"/><path d="M310 106V850"/><path d="M525 106V850"/><path d="M750 106V850"/><path d="M975 106V850"/><path d="M1185 106V850"/><path d="M1350 106V850"/></g><g stroke="#4cdbf7" stroke-width="2" marker-end="url(#arrow2)" fill="none"><path d="M105 160H300"/><path d="M310 220H515"/><path d="M525 290H740"/><path d="M750 350H535"/><path d="M525 410H115"/><path d="M525 485H965"/><path d="M975 545H1175"/><path d="M1185 605H760"/><path d="M105 680H1340"/><path d="M105 740H515"/><path d="M525 800H1340"/><path d="M1350 850H760"/></g><g text-anchor="start" font-family="IBM Plex Mono,monospace" font-size="12"><text x="125" y="150" fill="#e1e7ff">命令 + idempotency_key</text><text x="330" y="210" fill="#e1e7ff">x-request-id</text><text x="545" y="280" fill="#e1e7ff">状态 + outbox + 审计</text><text x="555" y="340" fill="#9da8c2">原子提交</text><text x="150" y="400" fill="#e1e7ff">已受理 + request_id</text><text x="660" y="475" fill="#e1e7ff">中继版本化事件</text><text x="1010" y="535" fill="#e1e7ff">事件 + request_id</text><text x="850" y="595" fill="#e1e7ff">幂等结果</text><text x="430" y="670" fill="#ffb454">用户签名交易(request_ref)</text><text x="220" y="730" fill="#e1e7ff">tx_hash + request_id</text><text x="850" y="790" fill="#e1e7ff">验证回执 + 事件</text><text x="850" y="840" fill="#9da8c2">对账已确认状态</text></g><text x="720" y="885" fill="#72809e" font-size="12" letter-spacing="3">没有回执与事件回读，不判定成功</text></g></svg>
